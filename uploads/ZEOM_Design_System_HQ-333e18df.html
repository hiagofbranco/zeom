<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZEOM Design System</title>
<meta name="description" content="ZEOM Design System - visualização em alta fidelidade do documento original.">
<style>
  :root {
    color-scheme: dark;
    --bg: #171713;
    --panel: #21211c;
    --border: #3d3d34;
    --text: #f6f5ef;
    --muted: #b3b3a8;
    --accent: #ccc290;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(circle at top, #2a2922 0, var(--bg) 40%, #11110e 100%);
    color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  .app { height: 100%; display: grid; grid-template-rows: 58px 1fr; }
  header {
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding: 0 18px;
    background: rgba(33,33,28,.96);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(10px);
  }
  .brand { display:flex; align-items:center; gap:12px; min-width:0; }
  .mark { width:28px; height:28px; border:1.5px solid var(--accent); border-radius:50%; position:relative; opacity:.95; }
  .mark::before,.mark::after { content:""; position:absolute; inset:4px; border:1px solid var(--accent); border-radius:50%; transform:rotate(55deg); }
  .mark::after { transform:rotate(-55deg); inset:7px 2px; }
  .title { font-size:14px; font-weight:650; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sub { font-size:11px; color:var(--muted); margin-left:8px; }
  .actions { display:flex; align-items:center; gap:8px; }
  button {
    appearance:none; border:1px solid var(--border); background:#2c2c25; color:var(--text);
    border-radius:8px; height:34px; padding:0 12px; cursor:pointer; font:inherit; font-size:12px;
  }
  button:hover { border-color:#6c664e; background:#34342d; }
  button.primary { border-color:#9e9671; background:#9e9671; color:#21211c; font-weight:650; }
  main { min-height:0; position:relative; }
  .viewer { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:14px; }
  iframe { width:100%; height:100%; border:1px solid var(--border); border-radius:10px; background:#151511; box-shadow:0 20px 70px rgba(0,0,0,.4); }
  .fallback { position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center; padding:40px; color:var(--muted); }
  .fallback a { color:var(--accent); }
  .hint { position:absolute; left:24px; bottom:24px; z-index:2; background:rgba(33,33,28,.92); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:11px; color:var(--muted); pointer-events:none; }
  @media (max-width: 720px) {
    .sub { display:none; }
    header { padding:0 10px; }
    .viewer { padding:8px; }
    .hint { display:none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="mark" aria-hidden="true"></div>
      <div class="title">ZEOM Design System <span class="sub">renderização vetorial • V1.0 • agosto 2026</span></div>
    </div>
    <div class="actions">
      <button id="openTab">Abrir em nova aba</button>
      <button id="print" class="primary">Imprimir / Exportar PDF</button>
    </div>
  </header>
  <main>
    <div class="viewer"><iframe id="pdfFrame" title="ZEOM Design System"></iframe></div>
    <div class="fallback" id="fallback">
      <div>
        <h2>Visualização de PDF não disponível neste navegador.</h2>
        <p>Use o botão abaixo para abrir o arquivo original.</p>
        <p><a id="download" href="#">Abrir PDF</a></p>
      </div>
    </div>
    <div class="hint">Use Ctrl/Cmd + + para ampliar e Ctrl/Cmd + - para reduzir.</div>
  </main>
</div>
