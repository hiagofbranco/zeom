<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zeom Email Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
:root{
  --bg:#1B1B17;--panel:#21211C;--panel-2:#2C2C25;--panel-3:#34342D;--line:#3D3D34;
  --text:#FAFAF9;--muted:#B3B3A8;--faint:#8A8371;--gold:#CCC290;--gold-strong:#9E9671;
  --danger:#E08A7A;--ok:#9FC79A;--desk:#E4E1D5;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Geist',Helvetica,Arial,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-rows:56px 1fr;grid-template-columns:minmax(0,1fr);height:100vh}

/* topo */
.top{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;white-space:nowrap}
.brand b{font-weight:400;letter-spacing:.3px}
.brand span{color:var(--faint);font-size:12px}
.brand i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F1EBC9,#CCC290 45%,#6C664E);display:block}
.top .sp{flex:1}
.grp{display:flex;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--muted);white-space:nowrap}
.btn:hover{color:var(--text);background:var(--panel-3)}
.btn.on{background:var(--panel-3);color:var(--text)}
.btn:disabled{opacity:.35;cursor:default;background:transparent}
.btn.primary{background:var(--gold-strong);color:#21211C;font-weight:600}
.btn.primary:hover{background:var(--gold)}
.btn.outline{border-color:var(--line);background:var(--panel-2)}
.btn.danger:hover{color:var(--danger)}
.btn svg{width:16px;height:16px;flex:none}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:38px;z-index:50;min-width:230px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 12px 40px rgba(0,0,0,.45);display:none}
.menu.open .menu-pop{display:block}
.menu-pop button{display:flex;width:100%;align-items:center;gap:10px;text-align:left;padding:9px 10px;border:0;background:transparent;border-radius:6px;color:var(--text)}
.menu-pop button:hover{background:var(--panel-3)}
.menu-pop small{display:block;color:var(--faint);font-size:11.5px}
.menu-pop hr{border:0;border-top:1px solid var(--line);margin:6px 2px}

/* colunas */
.main{display:grid;grid-template-columns:300px minmax(0,1fr) 320px;min-height:0}
.col{min-height:0;min-width:0;overflow:auto}
.lib,.top,.lib-card,.tools,.stage-bar{-webkit-user-select:none;user-select:none}
.dragging,.dragging *{-webkit-user-select:none!important;user-select:none!important}
.lib{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.insp{background:var(--panel);border-left:1px solid var(--line)}

/* biblioteca */
.lib-head{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.lib-head h2,.insp h2{margin:0 0 4px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.lib-head p{margin:0 0 10px;color:var(--faint);font-size:12px;line-height:17px}
.field{width:100%;height:34px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);padding:0 10px;outline:none}
.field:focus{border-color:var(--gold-strong)}
textarea.field{height:auto;min-height:64px;padding:8px 10px;resize:vertical;line-height:18px}
select.field{padding-right:4px}
.cats{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px}
.chip.on{background:var(--gold-strong);border-color:var(--gold-strong);color:#21211C;font-weight:600}
.lib-list{flex:1;overflow:auto;padding:4px 14px 40px}
.lib-sec h3{position:sticky;top:0;z-index:2;margin:0;padding:12px 0 8px;background:var(--panel);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lib-sec h3 small{color:var(--faint);font-weight:400;letter-spacing:0;text-transform:none;margin-left:4px}
.lib-items{display:flex;flex-direction:column;gap:10px}
.lib-card{border:1px solid var(--line);border-radius:9px;background:var(--panel-2);overflow:hidden;cursor:grab;transition:border-color .12s}
.lib-card:hover{border-color:var(--gold-strong)}
.lib-card:active{cursor:grabbing}
.thumb{position:relative;height:90px;overflow:hidden;background:var(--desk);pointer-events:none}
.thumb iframe{position:absolute;left:0;top:0;width:600px;border:0;transform-origin:0 0}
.thumb::after{content:"";position:absolute;inset:auto 0 0 0;height:22px;background:linear-gradient(transparent,rgba(0,0,0,.08))}
.lib-meta{display:flex;align-items:center;gap:8px;padding:8px 10px}
.lib-meta b{flex:1;font-weight:400;font-size:12.5px;line-height:16px}
.lib-add{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--gold);display:grid;place-items:center;font-size:16px;line-height:1}
.lib-card:hover .lib-add{background:var(--gold-strong);color:#21211C;border-color:var(--gold-strong)}
.lib-empty{color:var(--faint);padding:30px 4px;text-align:center}

/* canvas */
.stage{background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:28px 24px 120px}
.stage-bar{width:100%;max-width:600px;display:flex;align-items:center;justify-content:space-between;color:var(--faint);font-size:12px;margin-bottom:10px;gap:10px}
.stage-bar b{color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.desk{width:100%;display:flex;justify-content:center;padding:24px 0;border-radius:12px;background:var(--desk);transition:background .2s}
.paper{width:600px;max-width:100%;min-height:200px;border-radius:8px;position:relative;transition:width .2s}
.stage.mobile .paper{width:375px}
.canvas{display:flex;flex-direction:column;min-height:200px;border-radius:8px}
.canvas:empty{min-height:0}
.blk{position:relative}
.blk iframe{display:block;width:100%;border:0;height:60px}
.blk:first-child iframe{border-radius:8px 8px 0 0}
.blk:last-child iframe{border-radius:0 0 8px 8px}
.blk:only-child iframe{border-radius:8px}
.blk::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:2px;box-shadow:inset 0 0 0 0 transparent;transition:box-shadow .1s}
.blk:hover::after{box-shadow:inset 0 0 0 1px rgba(158,150,113,.8)}
.blk.sel::after{box-shadow:inset 0 0 0 2px var(--gold-strong)}
.tools{position:absolute;right:-48px;top:0;display:flex;flex-direction:column;gap:4px;opacity:0;transition:opacity .12s;z-index:5}
.blk:hover .tools,.blk.sel .tools{opacity:1}
.tool{width:36px;height:34px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);display:grid;place-items:center}
.tool:hover{color:var(--text);border-color:var(--gold-strong)}
.tool.del:hover{color:var(--danger);border-color:var(--danger)}
.tool.handle{cursor:grab}
.tool svg{width:16px;height:16px}
.tag{position:absolute;left:0;top:-22px;height:20px;line-height:20px;padding:0 8px;border-radius:5px 5px 0 0;background:var(--gold-strong);color:#21211C;font-size:11px;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;z-index:4}
.blk.sel .tag{opacity:1}
.blk:first-child .tag{top:0;border-radius:0 0 5px 0}
.dropzone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;min-height:280px;border:2px dashed rgba(108,102,78,.45);border-radius:8px;color:#6C664E;padding:30px}
.dropzone b{font-size:17px;font-weight:400;color:#21211C}
.dropzone .presets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.dropzone .presets button{border:1px solid rgba(108,102,78,.4);background:rgba(255,255,255,.55);color:#21211C;border-radius:7px;padding:8px 12px}
.dropzone .presets button:hover{background:#fff}
.canvas:not(:empty)+.dropzone{display:none}
/* indicador de posição ao arrastar */
.canvas .lib-card,.canvas .sortable-ghost{height:6px!important;min-height:0!important;padding:0!important;border:0!important;border-radius:3px!important;background:var(--gold-strong)!important;overflow:hidden;margin:3px 0}
.canvas .lib-card>*,.canvas .sortable-ghost>*{display:none!important}
.dragging iframe{pointer-events:none}
.sortable-fallback{opacity:.9!important;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.sortable-fallback .tools,.sortable-fallback .tag{display:none}

/* inspetor */
.insp-in{padding:16px 16px 60px}
.sec{border-bottom:1px solid var(--line);padding:0 0 16px;margin:0 0 16px}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 10px;font-size:13px;font-weight:600}
.sec p,.hint{margin:0 0 10px;color:var(--muted);font-size:12.5px;line-height:19px}
.hint{color:var(--faint);font-size:12px}
.lbl{display:block;margin:10px 0 5px;color:var(--muted);font-size:12px}
.lbl small{color:var(--faint)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row .btn{flex:1;justify-content:center}
.back{display:inline-flex;align-items:center;gap:4px;margin:0 0 12px;padding:0;border:0;background:none;color:var(--gold);font-size:12px}
.note{background:var(--panel-2);border:1px solid var(--line);border-left:2px solid var(--gold-strong);border-radius:6px;padding:9px 11px;color:var(--muted);font-size:12px;line-height:18px}
.imgprev{display:block;max-width:100%;max-height:140px;margin:0 auto 8px;border-radius:6px;background:repeating-conic-gradient(#3D3D34 0 25%,#2C2C25 0 50%) 0 0/14px 14px}
.icons{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.icons button{aspect-ratio:1;border-radius:7px;border:1px solid var(--line);background:#F6F5EF;display:grid;place-items:center;padding:6px}
.icons button.dark{background:#2C2C25}
.icons button.on{outline:2px solid var(--gold);outline-offset:1px}
.icons img{max-width:100%;max-height:100%}
.vars{display:flex;flex-wrap:wrap;gap:5px}
.vars button{border:1px solid var(--line);background:var(--panel-2);border-radius:5px;padding:4px 7px;font-size:11.5px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
.vars button:hover{color:var(--text);border-color:var(--gold-strong)}
.drafts{display:flex;flex-direction:column;gap:6px}
.draft{display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2)}
.draft span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.draft small{color:var(--faint);display:block;font-size:11px}
.draft button{border:0;background:none;color:var(--muted);padding:4px 6px;border-radius:5px}
.draft button:hover{background:var(--panel-3);color:var(--text)}
.check{display:flex;gap:8px;align-items:flex-start;margin-top:10px;color:var(--muted);font-size:12px;line-height:17px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--text);color:#21211C;padding:10px 16px;border-radius:8px;font-weight:600;transition:all .2s;z-index:100;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
.lib-toggle{display:none}

@media (max-width:1180px){
  .main{grid-template-columns:270px minmax(0,1fr) 290px}
  .tools{right:auto;left:auto;top:6px;right:6px;flex-direction:row}
}
@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto;min-height:100vh;grid-template-rows:auto 1fr}
  .top{flex-wrap:wrap;padding:10px 16px;gap:8px}
  .top .sp{display:none}
  .brand span{display:none}
  .main{grid-template-columns:minmax(0,1fr)}
  .col{overflow:visible}
  .lib{border-right:0;border-bottom:1px solid var(--line);max-height:none}
  .lib-list{max-height:340px}
  .insp{border-left:0;border-top:1px solid var(--line)}
  .stage{padding:20px 16px 40px}
  .btn .t{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><i></i><b>zeom</b><span>Editor de e-mails</span></div>
    <div class="sp"></div>
    <div class="grp">
      <button class="btn" id="undo" title="Desfazer (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg><span class="t">Desfazer</span></button>
      <button class="btn" id="redo" title="Refazer (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    </div>
    <div class="grp" title="Largura da pré-visualização">
      <button class="btn on" data-view="desktop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span class="t">Desktop</span></button>
      <button class="btn" data-view="mobile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></svg><span class="t">Celular</span></button>
    </div>
    <div class="grp" title="Tema do leitor">
      <button class="btn on" data-theme="light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="t">Claro</span></button>
      <button class="btn" data-theme="dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg><span class="t">Escuro</span></button>
    </div>
    <button class="btn outline" id="preview" title="Abrir o e-mail final numa nova aba"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><span class="t">Visualizar</span></button>
    <div class="menu" id="exportMenu">
      <button class="btn primary" id="exportBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>Exportar</button>
      <div class="menu-pop">
        <button data-act="download"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg><span>Baixar HTML<small>Arquivo pronto para a ferramenta de disparo</small></span></button>
        <button data-act="copy"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg><span>Copiar HTML<small>Para colar direto no editor de código</small></span></button>
        <hr>
        <button data-act="save-json"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h8V3M8 21v-7h8v7"/></svg><span>Salvar projeto (.json)<small>Para continuar editando depois ou compartilhar</small></span></button>
        <button data-act="open-json"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Abrir projeto (.json)<small>Carrega um e-mail salvo anteriormente</small></span></button>
      </div>
    </div>
    <input type="file" id="fileJson" accept=".json,application/json" hidden>
    <input type="file" id="fileImg" accept="image/*" hidden>
  </header>

  <div class="main">
    <aside class="col lib">
      <div class="lib-head">
        <h2>Biblioteca de blocos</h2>
        <p>Arraste um bloco para o e-mail ou clique em <b style="color:var(--gold)">+</b> para adicionar abaixo do bloco selecionado.</p>
        <input class="field" id="search" type="search" placeholder="Buscar bloco (ex.: botão, rodapé, depoimento)">
        <div class="cats" id="cats"></div>
      </div>
      <div class="lib-list" id="libList"></div>
    </aside>

    <section class="col stage" id="stage">
      <div class="stage-bar"><b id="stageName">Novo e-mail</b><span id="stageCount"></span></div>
      <div class="desk" id="desk">
        <div class="paper">
          <div class="canvas" id="canvas"></div>
          <div class="dropzone" id="dropzone">
            <b>Comece arrastando blocos para cá</b>
            <span>ou escolha um modelo para começar mais rápido</span>
            <div class="presets" id="presets"></div>
          </div>
        </div>
      </div>
    </section>

    <aside class="col insp"><div class="insp-in" id="insp"></div></aside>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const BASE_CSS = /*__BASE_CSS__*/"";
const BLOCKS = /*__BLOCKS__*/[];
const ICONS = /*__ICONS__*/{};
const BY_ID = Object.fromEntries(BLOCKS.map(b => [b.id, b]));
const FONT_URL = 'https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;600&display=swap';
const STORE_KEY = 'zeom-email-editor:atual';
const DRAFTS_KEY = 'zeom-email-editor:rascunhos';
const DESK = { light: '#E4E1D5', dark: '#21211C' };

const TEXT_VARS = ['{{nome}}', '{{codigo}}', '{{minutos_expiracao}}', '{{RAZAO_SOCIAL}}', '{{ENDERECO_POSTAL}}'];
const LINK_VARS = ['https://app.zeom.com', '{{LINK_app_home}}', '{{LINK_acessar_conta}}', '{{LINK_finalizar_cadastro}}', '{{LINK_app_conta}}', '{{LINK_app_cartao}}', '{{LINK_app_cambio}}', '{{LINK_fazer_pix}}', '{{LINK_ajuda}}', '{{LINK_whatsapp_suporte}}', '{{LINK_privacidade}}', '{{LINK_termos}}', '{{LINK_preferencias}}', '{{LINK_cancelar_inscricao}}', '{{LINK_instagram}}', '{{LINK_linkedin}}', '{{LINK_x}}'];

const PRESETS = [
  { name: 'Boas-vindas', blocks: ['header-logo', 'hero-dark', 'corpo-steps', 'cta-primary', 'humano-assinatura', 'footer-full'] },
  { name: 'Comunicado', blocks: ['header-logo-eyebrow', 'hero-light', 'corpo-para', 'cards-accent', 'cta-primary', 'footer-compliance'] },
  { name: 'Newsletter', blocks: ['header-logo-menu', 'header-imagem-overlay', 'blog-destaque', 'blog-lista', 'divisor-rule', 'app-badges', 'footer-social'] },
  { name: 'Transacional', blocks: ['header-logo-eyebrow', 'hero-numeral', 'dados-rows', 'cta-secondary', 'footer-min'] },
];

/* ---------- utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
};
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}
const ICON = {
  grip: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 15 6-6 6 6"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>',
  dup: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>',
  del: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
};

/* ---------- estado + histórico ---------- */
let state = store.get(STORE_KEY, null) || { name: 'Novo e-mail', subject: '', preheader: '', blocks: [] };
state.blocks = state.blocks.filter(b => BY_ID[b.id]);
let theme = 'light', view = 'desktop';
let selected = null;           // { uid, el }
const undoStack = [], redoStack = [];
let lastCheckpoint = 0;

const snapshot = () => JSON.stringify(state);
function checkpoint(force) {
  const now = Date.now();
  if (!force && now - lastCheckpoint < 1200) return;
  lastCheckpoint = now;
  undoStack.push(snapshot()); if (undoStack.length > 80) undoStack.shift();
  redoStack.length = 0; updateUndo();
}
function persist() { store.set(STORE_KEY, state); updateMeta(); }
function updateUndo() { $('#undo').disabled = !undoStack.length; $('#redo').disabled = !redoStack.length; }
function restore(json) { state = JSON.parse(json); selected = null; renderCanvas(); renderInspector(); persist(); updateUndo(); }
function undo() { if (!undoStack.length) return; redoStack.push(snapshot()); restore(undoStack.pop()); lastCheckpoint = 0; }
function redo() { if (!redoStack.length) return; undoStack.push(snapshot()); restore(redoStack.pop()); lastCheckpoint = 0; }

/* ---------- HTML dos blocos ---------- */
const EDITOR_CSS = `html,body{overflow:hidden}.wrap{padding:0!important}.container{border-radius:0!important}
[contenteditable]{outline:none;cursor:text;border-radius:2px}
[contenteditable]:hover{box-shadow:0 0 0 1px rgba(158,150,113,.75)}
[contenteditable]:focus{box-shadow:0 0 0 2px #9E9671}
img{cursor:pointer}img:hover{outline:2px dashed #9E9671;outline-offset:1px}
.z-sel{outline:2px solid #9E9671!important;outline-offset:2px}`;

function blockDoc(html, css, opts = {}) {
  return `<!DOCTYPE html><html lang="pt-BR" data-theme="${theme}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="${FONT_URL}" rel="stylesheet"><style>${BASE_CSS}${css}${opts.editor ? EDITOR_CSS : '.wrap{padding:0!important}.container{border-radius:0!important}html,body{overflow:hidden}'}</style></head><body style="margin:0;padding:0;background:#E4E1D5;-webkit-font-smoothing:antialiased"><table class="desk" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#E4E1D5"><tr><td align="center" class="wrap" style="padding:0"><table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" class="container s-card" style="width:600px;max-width:600px;background:#FFFFFF;font-weight:300">${html}</table></td></tr></table></body></html>`;
}

function exportHtml() {
  const used = [...new Set(state.blocks.map(b => b.id))];
  const css = BASE_CSS + used.map(id => BY_ID[id].css).join('');
  const pre = state.preheader ? `<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;opacity:0">${esc(state.preheader)}${'&nbsp;&#8203;'.repeat(40)}</div>\n` : '';
  const rows = state.blocks.map(b => `<!-- bloco: ${BY_ID[b.id].cat} / ${BY_ID[b.id].name} -->\n${b.html}`).join('\n');
  return `<!DOCTYPE html>
<html lang="pt-BR" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>

<meta name="supported-color-schemes" content="light dark">
<title>${esc(state.subject || state.name)}</title>
<!--[if mso]>
<noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
<![endif]-->
<!--[if !mso]><!--><link href="${FONT_URL}" rel="stylesheet"><!--<![endif]-->
<style>${css}</style>
</head>
<body style="margin:0;padding:0;background:#E4E1D5;-webkit-font-smoothing:antialiased">
${pre}<table class="desk" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#E4E1D5"><tr><td align="center" class="wrap" style="padding:24px"><table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" class="container s-card" style="width:600px;max-width:600px;background:#FFFFFF;border-radius:8px;font-weight:300">
${rows}
</table></td></tr></table>

}

/* ---------- canvas ---------- */
const canvas = $('#canvas');

function renderCanvas() {
  canvas.innerHTML = '';
  state.blocks.forEach(b => canvas.appendChild(makeBlockEl(b)));
  updateMeta();
}

function makeBlockEl(b) {
  const def = BY_ID[b.id];
  const el = document.createElement('div');
  el.className = 'blk'; el.dataset.uid = b.uid;
  el.innerHTML = `<span class="tag">${esc(def.cat)} · ${esc(def.name)}</span>
    <div class="tools">
      <button class="tool handle" title="Arrastar para reordenar">${ICON.grip}</button>
      <button class="tool" data-a="up" title="Subir">${ICON.up}</button>
      <button class="tool" data-a="down" title="Descer">${ICON.down}</button>
      <button class="tool" data-a="dup" title="Duplicar">${ICON.dup}</button>
      <button class="tool del" data-a="del" title="Excluir bloco">${ICON.del}</button>
    </div>`;
  const fr = document.createElement('iframe');
  fr.title = def.name;
  el.appendChild(fr);
  loadFrame(el, b);
  el.querySelector('.tools').addEventListener('click', e => {
    const a = e.target.closest('[data-a]')?.dataset.a; if (!a) return;
    ({ up: () => moveBlock(b.uid, -1), down: () => moveBlock(b.uid, 1), dup: () => duplicateBlock(b.uid), del: () => deleteBlock(b.uid) })[a]();
  });
  return el;
}

function loadFrame(el, b) {
  const fr = el.querySelector('iframe');
  const blk = () => state.blocks.find(x => x.uid === b.uid);
  fr.onload = () => wireFrame(el, fr, b.uid);
  fr.srcdoc = blockDoc(blk().html, BY_ID[b.id].css, { editor: true });
}

function fitFrame(fr) {
  const d = fr.contentDocument; if (!d || !d.body) return;
  const h = d.querySelector('.desk')?.offsetHeight || d.body.scrollHeight;
  fr.style.height = h + 'px';
}

function hasOwnText(el) {
  for (const n of el.childNodes) if (n.nodeType === 3 && n.textContent.replace(/[\s ]/g, '')) return true;
  return false;
}

function wireFrame(el, fr, id) {
  const d = fr.contentDocument, w = fr.contentWindow;
  fitFrame(fr);
  try { new w.ResizeObserver(() => fitFrame(fr)).observe(d.body); } catch { }
  d.fonts?.ready.then(() => fitFrame(fr));
  d.querySelectorAll('img').forEach(i => i.addEventListener('load', () => fitFrame(fr)));

  const root = d.querySelector('.container');
  root.querySelectorAll('td,th,div,p,a,span,li,h1,h2,h3,h4,strong,b,em,font').forEach(n => {
    if (n.closest('[contenteditable]')) return;
    if (hasOwnText(n)) { n.contentEditable = 'true'; n.spellcheck = true; }
  });

  d.addEventListener('click', e => {
    if (e.target.closest('a')) e.preventDefault();
    selectEl(id, e.target);
  }, true);
  d.addEventListener('input', () => { checkpoint(); scheduleSync(id); });
  d.addEventListener('paste', e => {
    e.preventDefault();
    const text = (e.clipboardData || w.clipboardData).getData('text/plain');
    d.execCommand('insertText', false, text);
  });
  d.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && e.target.isContentEditable) { e.preventDefault(); d.execCommand('insertLineBreak'); }
    handleShortcut(e);
  });
  if (selected?.uid === id) { el.classList.add('sel'); }
}

const syncTimers = {};
function scheduleSync(id) { clearTimeout(syncTimers[id]); syncTimers[id] = setTimeout(() => syncBlock(id), 250); }
function frameOf(id) { return canvas.querySelector(`.blk[data-uid="${id}"] iframe`); }
function cleanHtml(root) {
  const c = root.cloneNode(true);
  c.querySelectorAll('[contenteditable]').forEach(n => { n.removeAttribute('contenteditable'); n.removeAttribute('spellcheck'); });
  c.querySelectorAll('.z-sel').forEach(n => { n.classList.remove('z-sel'); if (!n.className) n.removeAttribute('class'); });
  const only = c.children.length === 1 && c.children[0].tagName === 'TBODY' ? c.children[0] : c;
  return only.innerHTML;
}
function syncBlock(id) {
  clearTimeout(syncTimers[id]);
  const fr = frameOf(id), b = state.blocks.find(x => x.uid === id);
  if (!fr || !b || !fr.contentDocument) return;
  const root = fr.contentDocument.querySelector('.container'); if (!root) return;
  b.html = cleanHtml(root);
  persist();
}
function syncAll() { state.blocks.forEach(b => syncBlock(b.uid)); }

function insertBlock(defId, index, html) {
  checkpoint(true);
  const b = { uid: uid(), id: defId, html: html ?? BY_ID[defId].html };
  if (index == null || index > state.blocks.length) index = state.blocks.length;
  state.blocks.splice(index, 0, b);
  const el = makeBlockEl(b);
  canvas.insertBefore(el, canvas.children[index] || null);
  persist();
  return b;
}
function addAfterSelection(defId) {
  const i = selected ? state.blocks.findIndex(b => b.uid === selected.uid) + 1 : state.blocks.length;
  const b = insertBlock(defId, i);
  selectBlock(b.uid);
  canvas.querySelector(`[data-uid="${b.uid}"]`).scrollIntoView({ behavior: 'smooth', block: 'center' });
  toast(`“${BY_ID[defId].name}” adicionado`);
}
function moveBlock(id, dir) {
  syncAll();
  const i = state.blocks.findIndex(b => b.uid === id), j = i + dir;
  if (j < 0 || j >= state.blocks.length) return;
  checkpoint(true);
  const [b] = state.blocks.splice(i, 1); state.blocks.splice(j, 0, b);
  const el = canvas.children[i];
  canvas.insertBefore(el, dir < 0 ? canvas.children[j] : canvas.children[j].nextSibling);
  loadFrame(el, b); // mover um iframe no DOM o recarrega
  persist();
}
function duplicateBlock(id) {
  syncBlock(id);
  const i = state.blocks.findIndex(b => b.uid === id);
  const b = insertBlock(state.blocks[i].id, i + 1, state.blocks[i].html);
  selectBlock(b.uid);
}
function deleteBlock(id) {
  syncAll(); checkpoint(true);
  const i = state.blocks.findIndex(b => b.uid === id);
  state.blocks.splice(i, 1);
  canvas.querySelector(`[data-uid="${id}"]`)?.remove();
  if (selected?.uid === id) { selected = null; renderInspector(); }
  persist(); toast('Bloco excluído — Ctrl+Z para desfazer');
}

/* ---------- seleção ---------- */
function selectBlock(id) { selectEl(id, null); }
function selectEl(id, target) {
  if (selected?.el && selected.el.ownerDocument) selected.el.classList.remove('z-sel');
  canvas.querySelectorAll('.blk.sel').forEach(n => n.classList.toggle('sel', n.dataset.uid === id));
  canvas.querySelector(`[data-uid="${id}"]`)?.classList.add('sel');
  let el = null;
  if (target && target.nodeType === 1) {
    el = target.tagName === 'IMG' ? target : (target.closest('a') || target.closest('[contenteditable]') || target.closest('[background]'));
    if (el && (el.tagName === 'IMG' || (el.tagName === 'A' && !el.isContentEditable))) el.classList.add('z-sel');
  }
  selected = { uid: id, el };
  renderInspector();
}
function clearSelection() {
  if (selected?.el) selected.el.classList.remove('z-sel');
  selected = null;
  canvas.querySelectorAll('.blk.sel').forEach(n => n.classList.remove('sel'));
  renderInspector();
}

/* ---------- inspetor ---------- */
const insp = $('#insp');
function renderInspector() {
  if (!selected || !state.blocks.find(b => b.uid === selected.uid)) return renderEmailPanel();

  const i = state.blocks.indexOf(b);
  let h = `<button class="back" data-x="back">‹ Configurações do e-mail</button>
  <div class="sec"><h2>Bloco ${i + 1} de ${state.blocks.length}</h2><h3>${esc(def.cat)} · ${esc(def.name)}</h3>
    ${def.note ? `<div class="note">${esc(def.note)}</div>` : ''}
    <div class="row" style="margin-top:12px">
      <button class="btn outline" data-x="up" ${i === 0 ? 'disabled' : ''}>${ICON.up}Subir</button>
      <button class="btn outline" data-x="down" ${i === state.blocks.length - 1 ? 'disabled' : ''}>${ICON.down}Descer</button>
    </div>
    <div class="row" style="margin-top:6px">
      <button class="btn outline" data-x="dup">${ICON.dup}Duplicar</button>
      <button class="btn outline danger" data-x="del">${ICON.del}Excluir</button>
    </div>
  </div>`;

  if (!el) {
    h += `<div class="sec"><h3>Como editar</h3><p>Clique em qualquer <b>texto</b> do bloco para escrever direto nele. Clique em uma <b>imagem</b> para trocá-la, ou em um <b>botão/link</b> para mudar o endereço.</p><p class="hint"><span class="kbd">Shift</span>+<span class="kbd">Enter</span> também quebra linha. Colar texto remove a formatação de origem.</p></div>`;
  }
  const img = el?.tagName === 'IMG' ? el : null;
  const link = el ? (el.tagName === 'A' ? el : el.closest('a')) : null;
  const bg = el ? el.closest('[background]') : null;
  const text = el?.isContentEditable ? el.closest('[contenteditable="true"]') : null;

  if (text) {
    h += `<div class="sec"><h3>Texto</h3><p>Escreva direto no e-mail. Selecione um trecho para aplicar estilo:</p>
      <div class="row"><button class="btn outline" data-cmd="bold"><b>N</b> Negrito</button><button class="btn outline" data-cmd="italic"><i>I</i> Itálico</button></div>
      <div class="row" style="margin-top:6px"><button class="btn outline" data-cmd="link">Criar link</button><button class="btn outline" data-cmd="removeFormat">Limpar estilo</button></div>
      <label class="lbl">Inserir variável <small>(personalização)</small></label>
      <div class="vars">${TEXT_VARS.map(v => `<button data-var="${esc(v)}">${esc(v)}</button>`).join('')}</div></div>`;
  }
  if (link) {
    const isBtn = !!link.closest('td[bgcolor]') || /padding/.test(link.getAttribute('style') || '');
    h += `<div class="sec"><h3>${isBtn ? 'Botão' : 'Link'}</h3>
      ${!link.isContentEditable && !img ? `<label class="lbl">Texto</label><input class="field" data-f="ltext" value="${esc(link.textContent)}">` : ''}
      <label class="lbl">Endereço (URL) <small>ou variável</small></label>
      <input class="field" data-f="href" list="linkvars" value="${esc(link.getAttribute('href') || '')}" placeholder="https://">
      <datalist id="linkvars">${LINK_VARS.map(v => `<option value="${esc(v)}">`).join('')}</datalist>
      ${link.isContentEditable && !img && !isBtn ? `<div class="row" style="margin-top:8px"><button class="btn outline" data-x="unlink">Remover link</button></div>` : ''}
      <p class="hint" style="margin-top:8px">O texto do ${isBtn ? 'botão' : 'link'} é editado direto no e-mail.</p></div>`;
  }
  if (img) h += imagePanel(img);
  if (bg && !img) {
    h += `<div class="sec"><h3>Imagem de fundo</h3><img class="imgprev" src="${esc(bg.getAttribute('background'))}" alt="">
      <label class="lbl">URL da imagem</label><input class="field" data-f="bg" value="${esc(bg.getAttribute('background'))}">
      <div class="row" style="margin-top:8px"><button class="btn outline" data-x="upload-bg">Enviar do computador</button></div>
      <p class="hint" style="margin-top:8px">No tema escuro o design system pode usar outra versão do degradê.</p></div>`;
  }
  insp.innerHTML = h;
  wireInspector(b, { img, link, bg, text });
}

function imagePanel(img) {
  const src = img.getAttribute('src') || '';
  const m = src.match(/icons\/png\/([a-z]+)-(.+)\.png$/);
  let icons = '';
  if (m && ICONS.official.includes(m[1])) {
    const variant = m[2];
    const list = ICONS.official.filter(n => ICONS.files.includes(`${n}-${variant}.png`));
    const dark = /dark|ivory/.test(variant);
    icons = `<label class="lbl">Trocar ícone</label><div class="icons">${list.map(n => `<button class="${dark ? 'dark' : ''} ${n === m[1] ? 'on' : ''}" data-icon="${ICONS.base}${n}-${variant}.png" title="${n}"><img src="${ICONS.base}${n}-${variant}.png" alt="${n}"></button>`).join('')}</div>`;
  }
  const keep = img.hasAttribute('height');
  return `<div class="sec"><h3>${icons ? 'Ícone' : 'Imagem'}</h3><img class="imgprev" src="${esc(src)}" alt="">
    ${icons}
    <label class="lbl">URL da imagem <small>(https)</small></label><input class="field" data-f="src" value="${esc(src.startsWith('data:') ? '' : src)}" placeholder="${src.startsWith('data:') ? 'Imagem enviada do computador' : 'https://'}">
    <div class="row" style="margin-top:8px"><button class="btn outline" data-x="upload">Enviar do computador</button></div>
    ${keep ? `<label class="check"><input type="checkbox" id="keepRatio" checked> Ajustar a altura à proporção da nova imagem</label>` : ''}
    <label class="lbl">Texto alternativo <small>(acessibilidade)</small></label><input class="field" data-f="alt" value="${esc(img.getAttribute('alt') || '')}" placeholder="Descreva a imagem">
    <p class="hint" style="margin-top:8px">Para o envio real, prefira uma URL pública (https). Imagens enviadas do computador ficam embutidas no HTML e alguns provedores de e-mail as bloqueiam.</p></div>`;
}

function wireInspector(b, { img, link, bg, text }) {
  const id = b.uid, fr = frameOf(id);
  const commit = () => { syncBlock(id); fitFrame(fr); };
  const before = () => { syncBlock(id); checkpoint(true); };
  insp.querySelectorAll('[data-x]').forEach(btn => btn.addEventListener('click', () => {
    const x = btn.dataset.x;
    if (x === 'back') return clearSelection();
    if (x === 'up' || x === 'down') { moveBlock(id, x === 'up' ? -1 : 1); return selectBlock(id); }
    if (x === 'dup') return duplicateBlock(id);
    if (x === 'del') return deleteBlock(id);
    if (x === 'unlink') { before(); link.replaceWith(...link.childNodes); commit(); return selectBlock(id); }
    if (x === 'upload' || x === 'upload-bg') pickImage(url => {
      before();
      if (x === 'upload') setImg(img, url); else setBg(bg, url);
      commit(); renderInspector();
    });
  }));
  insp.querySelectorAll('[data-f]').forEach(inp => {
    inp.addEventListener('focus', () => { syncBlock(id); checkpoint(true); });
    inp.addEventListener(inp.dataset.f === 'src' || inp.dataset.f === 'bg' ? 'change' : 'input', () => {
      const v = inp.value.trim(), f = inp.dataset.f;
      if (f === 'href') link.setAttribute('href', v || '#');
      if (f === 'ltext') link.textContent = inp.value;
      if (f === 'alt') img.setAttribute('alt', inp.value);
      if (f === 'src' && v) { setImg(img, v); setTimeout(renderInspector, 50); }
      if (f === 'bg' && v) { setBg(bg, v); renderInspector(); }
      commit();
    });
  });
  insp.querySelectorAll('[data-icon]').forEach(btn => btn.addEventListener('click', () => {
    before(); img.setAttribute('src', btn.dataset.icon); img.setAttribute('alt', btn.title); commit(); renderInspector();
  }));
  const w = fr.contentWindow, d = fr.contentDocument;
  insp.querySelectorAll('[data-cmd],[data-var]').forEach(btn => {
    btn.addEventListener('mousedown', e => e.preventDefault());
    btn.addEventListener('click', () => {
      w.focus();
      const sel = d.getSelection();
      if (!sel.rangeCount || !text.contains(sel.anchorNode)) { const r = d.createRange(); r.selectNodeContents(text); r.collapse(false); sel.removeAllRanges(); sel.addRange(r); }
      checkpoint(true);
      if (btn.dataset.var) d.execCommand('insertText', false, btn.dataset.var);
      else if (btn.dataset.cmd === 'link') {
        if (sel.isCollapsed) return toast('Selecione o trecho do texto que vai virar link');
        const url = prompt('Endereço do link (URL ou variável):', 'https://');
        if (!url) return;
        d.execCommand('createLink', false, url);
        d.getSelection().anchorNode?.parentElement?.closest('a')?.setAttribute('style', 'color:inherit;text-decoration:underline');
      } else d.execCommand(btn.dataset.cmd);
      commit();
    });
  });
}

function setImg(img, url) {
  const keep = $('#keepRatio')?.checked ?? false;
  img.setAttribute('src', url);
  if (keep) {
    const probe = new Image();
    probe.onload = () => {
      const wpx = parseInt(img.getAttribute('width')) || img.offsetWidth;
      if (!wpx || !probe.naturalWidth) return;
      const hpx = Math.round(wpx * probe.naturalHeight / probe.naturalWidth);
      img.setAttribute('height', hpx);
      if (img.style.height) img.style.height = hpx + 'px';
      syncBlock(selected?.uid); const f = frameOf(selected?.uid); f && fitFrame(f);
    };
    probe.src = url;
  }
}
function setBg(el, url) {
  el.setAttribute('background', url);
  el.style.backgroundImage = `url(${url})`;
  // a variação claro/escuro do degradê original deixa de valer para uma imagem própria
  [...el.classList].filter(c => c.startsWith('g-t--')).forEach(c => el.classList.remove(c));
}
let imgCallback;
function pickImage(cb) { imgCallback = cb; $('#fileImg').value = ''; $('#fileImg').click(); }
$('#fileImg').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  if (f.size > 1.5e6) toast('Imagem grande: considere comprimir antes (ideal < 300 KB)');
  const r = new FileReader(); r.onload = () => imgCallback?.(r.result); r.readAsDataURL(f);
});

/* painel do e-mail (nada selecionado) */
function renderEmailPanel() {
  const drafts = store.get(DRAFTS_KEY, []);
  insp.innerHTML = `
  <div class="sec"><h2>E-mail</h2>
    <label class="lbl">Nome interno</label><input class="field" data-m="name" value="${esc(state.name)}">
    <label class="lbl">Assunto</label><input class="field" data-m="subject" value="${esc(state.subject)}" placeholder="Ex.: Sua conta em dólar está pronta">
    <label class="lbl">Pré-header <small>(texto ao lado do assunto)</small></label><textarea class="field" data-m="preheader" placeholder="Ex.: Veja como começar em 3 passos">${esc(state.preheader)}</textarea>
  </div>
  <div class="sec"><h3>Rascunhos neste navegador</h3>
    <p class="hint">O e-mail atual é salvo automaticamente. Guarde versões para alternar entre vários e-mails.</p>
    <div class="row" style="margin-bottom:10px"><button class="btn outline" data-d="save">Guardar rascunho</button><button class="btn outline" data-d="new">Novo e-mail</button></div>
    <div class="drafts">${drafts.length ? drafts.map((d, i) => `<div class="draft"><span>${esc(d.state.name)}<small>${new Date(d.at).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })} · ${d.state.blocks.length} blocos</small></span><button data-d="open" data-i="${i}">Abrir</button><button data-d="rm" data-i="${i}" title="Apagar">✕</button></div>`).join('') : '<p class="hint">Nenhum rascunho guardado ainda.</p>'}</div>
  </div>
  <div class="sec"><h3>Começar de um modelo</h3><div class="row">${PRESETS.map((p, i) => `<button class="btn outline" data-p="${i}">${p.name}</button>`).join('')}</div>
    <p class="hint" style="margin-top:8px">Substitui os blocos atuais (dá para desfazer).</p></div>
  <div class="sec"><h3>Passo a passo</h3><p>1. Arraste blocos da biblioteca para o e-mail.<br>2. Clique nos textos e escreva direto neles.<br>3. Clique em imagens e botões para trocar imagem e link.<br>4. Confira em <b>Celular</b> e no tema <b>Escuro</b>.<br>5. <b>Exportar → Baixar HTML</b> para enviar.</p></div>`;
  insp.querySelectorAll('[data-m]').forEach(inp => {
    inp.addEventListener('focus', () => checkpoint(true));
    inp.addEventListener('input', () => { state[inp.dataset.m] = inp.value; persist(); });
  });
  insp.querySelectorAll('[data-p]').forEach(btn => btn.addEventListener('click', () => applyPreset(PRESETS[btn.dataset.p])));
  insp.querySelectorAll('[data-d]').forEach(btn => btn.addEventListener('click', () => {
    const list = store.get(DRAFTS_KEY, []), a = btn.dataset.d, i = +btn.dataset.i;
    syncAll();
    if (a === 'save') {
      const at = list.findIndex(d => d.state.name === state.name);
      const entry = { at: Date.now(), state: JSON.parse(snapshot()) };
      at >= 0 ? (list[at] = entry) : list.unshift(entry);
      toast(store.set(DRAFTS_KEY, list) ? 'Rascunho guardado' : 'Não foi possível salvar neste navegador — use Exportar → Salvar projeto');
    }
    if (a === 'new') { checkpoint(true); state = { name: 'Novo e-mail', subject: '', preheader: '', blocks: [] }; renderCanvas(); persist(); }
    if (a === 'open') { checkpoint(true); state = JSON.parse(JSON.stringify(list[i].state)); renderCanvas(); persist(); toast('Rascunho aberto'); }
    if (a === 'rm' && confirm(`Apagar o rascunho “${list[i].state.name}”?`)) { list.splice(i, 1); store.set(DRAFTS_KEY, list); }
    renderEmailPanel();
  }));
}

function applyPreset(p) {
  syncAll(); checkpoint(true);
  state.blocks = p.blocks.filter(id => BY_ID[id]).map(id => ({ uid: uid(), id, html: BY_ID[id].html }));
  if (state.name === 'Novo e-mail') state.name = p.name;
  selected = null; renderCanvas(); renderInspector(); persist();
  toast(`Modelo “${p.name}” aplicado`);
}

function updateMeta() {
  $('#stageName').textContent = state.name || 'Sem nome';
  $('#stageCount').textContent = state.blocks.length ? `${state.blocks.length} bloco${state.blocks.length > 1 ? 's' : ''}` : '';
}

/* ---------- biblioteca ---------- */
const cats = [...new Set(BLOCKS.map(b => b.cat))];
let activeCat = 'Todos', query = '';
const thumbObserver = new IntersectionObserver(entries => entries.forEach(en => {
  if (!en.isIntersecting) return;
  const card = en.target; thumbObserver.unobserve(card);
  const fr = card.querySelector('iframe'), def = BY_ID[card.dataset.id];
  fr.onload = () => {
    const w = card.querySelector('.thumb').offsetWidth || 270, s = w / 600;
    fr.style.transform = `scale(${s})`;
    const fit = () => { const h = fr.contentDocument?.querySelector('.desk')?.offsetHeight || 200; fr.style.height = h + 'px'; card.querySelector('.thumb').style.height = Math.min(Math.max(h * s, 40), 170) + 'px'; };
    fit(); fr.contentDocument?.fonts?.ready.then(fit); setTimeout(fit, 600);
  };
  fr.srcdoc = blockDoc(def.html, def.css);
}), { root: $('#libList'), rootMargin: '300px' });

function renderLibrary() {
  $('#cats').innerHTML = ['Todos', ...cats].map(c => `<button class="chip ${c === activeCat ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  const q = query.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const list = $('#libList'); list.innerHTML = '';
  let total = 0;
  (activeCat === 'Todos' ? cats : [activeCat]).forEach(cat => {
    const items = BLOCKS.filter(b => b.cat === cat && (!q || norm(b.name + ' ' + b.cat + ' ' + b.note).includes(q)));
    if (!items.length) return;
    total += items.length;
    const sec = document.createElement('div'); sec.className = 'lib-sec';
    sec.innerHTML = `<h3>${esc(cat)}<small>${items.length}</small></h3><div class="lib-items"></div>`;
    const wrap = sec.querySelector('.lib-items');
    items.forEach(def => {
      const card = document.createElement('div');
      card.className = 'lib-card'; card.dataset.id = def.id; card.title = def.note;
      card.innerHTML = `<div class="thumb"><iframe tabindex="-1" aria-hidden="true"></iframe></div><div class="lib-meta"><b>${esc(def.name)}</b><button class="lib-add" title="Adicionar ao e-mail">+</button></div>`;
      card.addEventListener('click', () => addAfterSelection(def.id));
      wrap.appendChild(card); thumbObserver.observe(card);
    });
    list.appendChild(sec);
    Sortable.create(wrap, { group: { name: 'email', pull: 'clone', put: false }, sort: false, forceFallback: true, fallbackOnBody: true, onStart: dragOn, onEnd: dragOff });
  });
  if (!total) list.innerHTML = `<div class="lib-empty">Nenhum bloco encontrado para “${esc(query)}”.</div>`;
}
$('#cats').addEventListener('click', e => { const c = e.target.closest('[data-c]'); if (!c) return; activeCat = c.dataset.c; renderLibrary(); $('#libList').scrollTop = 0; });
$('#search').addEventListener('input', e => { query = e.target.value.trim(); if (query) activeCat = 'Todos'; renderLibrary(); });

function dragOn() { document.body.classList.add('dragging'); syncAll(); }
function dragOff() { document.body.classList.remove('dragging'); }

Sortable.create(canvas, {
  group: { name: 'email', pull: false, put: true },
  handle: '.handle', animation: 160, forceFallback: true, fallbackOnBody: true,
  onStart: dragOn,
  onEnd(evt) {
    dragOff();
    if (evt.oldIndex === evt.newIndex) return;
    checkpoint(true);
    const [b] = state.blocks.splice(evt.oldIndex, 1); state.blocks.splice(evt.newIndex, 0, b);
    loadFrame(evt.item, b); persist();
  },
  onAdd(evt) {
    dragOff();
    const defId = evt.item.dataset.id; evt.item.remove();
    const b = insertBlock(defId, evt.newIndex);
    selectBlock(b.uid); toast(`“${BY_ID[defId].name}” adicionado`);
  },
});
// arrastar para a área vazia também funciona
Sortable.create($('#dropzone'), {
  group: { name: 'email', pull: false, put: true }, forceFallback: true, sort: false,
  onAdd(evt) { dragOff(); const id = evt.item.dataset.id; evt.item.remove(); const b = insertBlock(id); selectBlock(b.uid); },
});

/* ---------- topo ---------- */
$('#presets').innerHTML = PRESETS.map((p, i) => `<button data-p="${i}">${p.name}</button>`).join('');
$('#presets').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) applyPreset(PRESETS[b.dataset.p]); });
$('#undo').onclick = undo; $('#redo').onclick = redo;
document.querySelectorAll('[data-view]').forEach(btn => btn.onclick = () => {
  view = btn.dataset.view;
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b === btn));
  $('#stage').classList.toggle('mobile', view === 'mobile');
  setTimeout(() => canvas.querySelectorAll('iframe').forEach(fitFrame), 260);
});
document.querySelectorAll('[data-theme]').forEach(btn => btn.onclick = () => {
  theme = btn.dataset.theme;
  document.querySelectorAll('header [data-theme]').forEach(b => b.classList.toggle('on', b === btn));
  $('#desk').style.background = DESK[theme];
  document.querySelectorAll('iframe').forEach(f => { try { f.contentDocument.documentElement.dataset.theme = theme; } catch { } });
});
$('#preview').onclick = () => {
  syncAll();
  const url = URL.createObjectURL(new Blob([exportHtml()], { type: 'text/html' }));
  window.open(url, '_blank');
};
const slug = s => (s || 'email').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'email';
function download(name, content, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
$('#exportBtn').onclick = e => { e.stopPropagation(); $('#exportMenu').classList.toggle('open'); };
document.addEventListener('click', () => $('#exportMenu').classList.remove('open'));
$('#exportMenu .menu-pop').addEventListener('click', async e => {
  const act = e.target.closest('[data-act]')?.dataset.act; if (!act) return;
  syncAll();
  if (!state.blocks.length && act !== 'open-json') return toast('Adicione ao menos um bloco antes de exportar');
  if (act === 'download') { download(slug(state.name) + '.html', exportHtml(), 'text/html'); toast('HTML baixado'); }
  if (act === 'copy') {
    try { await navigator.clipboard.writeText(exportHtml()); toast('HTML copiado'); }
    catch { download(slug(state.name) + '.html', exportHtml(), 'text/html'); toast('Não deu para copiar — baixei o arquivo'); }
  }
  if (act === 'save-json') { download(slug(state.name) + '.zeom.json', JSON.stringify({ app: 'zeom-email-editor', v: 1, ...state }, null, 1), 'application/json'); toast('Projeto salvo'); }
  if (act === 'open-json') { $('#fileJson').value = ''; $('#fileJson').click(); }
});
$('#fileJson').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => {
    try {
      const d = JSON.parse(t);
      if (!Array.isArray(d.blocks)) throw 0;
      checkpoint(true);
      state = { name: d.name || f.name, subject: d.subject || '', preheader: d.preheader || '', blocks: d.blocks.filter(b => BY_ID[b.id]).map(b => ({ uid: uid(), id: b.id, html: b.html })) };
      selected = null; renderCanvas(); renderInspector(); persist(); toast('Projeto aberto');
    } catch { toast('Arquivo inválido — use um .json salvo por este editor'); }
  });
});

function handleShortcut(e) {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); syncAll(); e.shiftKey ? redo() : undo(); }
  else if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
  else if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); syncAll(); persist(); toast('Salvo automaticamente neste navegador'); }
  else if (e.key === 'Escape') { e.target.blur?.(); clearSelection(); }
}
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea') && !(e.key === 'Escape')) return;
  handleShortcut(e);
});
$('#stage').addEventListener('click', e => { if (e.target === e.currentTarget || e.target.classList.contains('stage-bar')) clearSelection(); });
window.addEventListener('beforeunload', syncAll);

renderLibrary(); renderCanvas(); renderInspector(); updateUndo();
</script>
</body>
</html>
