<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zeom — Imagens dos e-mails</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#21211C;font-family:'Geist',Helvetica,Arial,sans-serif;font-weight:400;color:#FAFAF9;-webkit-font-smoothing:antialiased}
a{color:#FAFAF9}
header.pg{padding:56px 48px 40px;border-bottom:1px solid #3D3D34}
.kicker{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#CCC290;margin-bottom:14px}
header.pg h1{margin:0;font-weight:400;font-size:38px;line-height:42px;letter-spacing:-1px}
header.pg p{margin:16px 0 0;max-width:600px;font-size:14px;line-height:22px;color:#B3B3A8}
header.pg a.back{display:inline-block;margin-bottom:22px;font-size:12.5px;color:#B3B3A8;text-decoration:none}
header.pg a.back:hover{color:#CCC290}
main{padding:40px 48px 64px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;max-width:1200px}
figure{margin:0;border:1px solid #3D3D34;border-radius:10px;overflow:hidden;background:#2C2C25}
figure img{display:block;width:100%;height:160px;object-fit:cover}
figcaption{padding:10px 14px;font-size:12.5px;color:#B3B3A8;font-family:ui-monospace,'SF Mono',Menlo,monospace}
@media(max-width:820px){header.pg,main{padding-left:24px;padding-right:24px}}
</style>
</head>
<body>
<header class="pg">
<a class="back" href="../../index-projeto.html">← Voltar ao índice do projeto</a>
<div class="kicker">Assets · Zeom</div>
<h1>Imagens dos e-mails</h1>
<p>Todas as fotos usadas nos headers das réguas de comunicação, em um só lugar.</p>
</header>
<main>
<div class="grid">
<figure><img src="pagamento-aproximacao.jpg" alt=""><figcaption>pagamento-aproximacao.jpg</figcaption></figure>
<figure><img src="pagamento-celular.jpg" alt=""><figcaption>pagamento-celular.jpg</figcaption></figure>
<figure><img src="pessoa-aviao-cidade.jpg" alt=""><figcaption>pessoa-aviao-cidade.jpg</figcaption></figure>
<figure><img src="pessoa-cafe.jpg" alt=""><figcaption>pessoa-cafe.jpg</figcaption></figure>
<figure><img src="pessoa-janela-cidade.jpg" alt=""><figcaption>pessoa-janela-cidade.jpg</figcaption></figure>
<figure><img src="pessoa-paris.jpg" alt=""><figcaption>pessoa-paris.jpg</figcaption></figure>
<figure><img src="pessoa-verificacao.jpg" alt=""><figcaption>pessoa-verificacao.jpg</figcaption></figure>
</div>
</main>
</body>
</html>
